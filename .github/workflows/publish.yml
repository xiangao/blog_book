on:
  push:
    branches: [master]

name: Quarto Publish

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys the pre-rendered _book/ committed to master. Many chapters use
# R and/or Stata with community-contributed packages (e.g. csdid, drdid)
# that can't be installed on a free GitHub Actions runner. Rather than
# fight that, we render locally and commit _book/. CI just deploys.

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
